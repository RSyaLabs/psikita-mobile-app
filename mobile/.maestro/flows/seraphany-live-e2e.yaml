appId: host.exp.exponent
---
- openLink: "exp://192.168.18.107:8081"

# 1. Assert SeraPhany Brand Identity and Login Screen loaded directly
- extendedWaitUntil:
    visible: "SeraPhany"
    timeout: 15000
- assertVisible: "Ruang aman untuk bercerita"
- assertVisible: "Temukan. Pahami. Sayangi diri."

# 2. Open Login Modal
- tapOn: "Masuk dengan Akun"
- extendedWaitUntil:
    visible: "Masuk ke Akun"
    timeout: 5000

# 3. Form Input Interaction
- tapOn: "Username atau email"
- inputText: "siti_rahayu"
- tapOn: "Kata sandi"
- inputText: "Password123!"

# 4. Hide keyboard and submit
- hideKeyboard:
    optional: true
- tapOn: "Masuk Sekarang"
