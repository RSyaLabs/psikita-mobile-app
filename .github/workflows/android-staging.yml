name: Android Staging APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Staging
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate Expo configuration
        run: npx --no-install expo config --json > /dev/null

      - name: Validate EAS project
        run: npx --no-install eas project:info

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Run unit tests
        run: npm run test:ci

      - name: Audit API contracts and routes
        run: npm run audit

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android staging APK locally
        run: |
          mkdir -p "$RUNNER_TEMP/android-build"
          npx --no-install eas build \
            --platform android \
            --profile staging \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/android-build/staging.apk"

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: seraphany-android-staging
          path: ${{ runner.temp }}/android-build/staging.apk
          if-no-files-found: error
          retention-days: 7

