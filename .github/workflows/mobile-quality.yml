name: Mobile Quality

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Tests, Knip & Contract Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Validate Expo configuration
        run: npx --no-install expo config --json > /dev/null

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Run unit tests
        run: npm run test:ci

      - name: Audit API contracts and routes
        run: npm run audit
